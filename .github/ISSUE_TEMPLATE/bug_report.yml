name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Android
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: UI language
      options:
        - English
        - Korean
  - type: markdown
    attributes:
      value: Do not include personal information. Report security issues privately through the Security tab, as described in SECURITY.md.
